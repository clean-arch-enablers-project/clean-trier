name: Java verification

on:
  push:
    paths:
      - "implementations/java/**"
      - ".github/workflows/java.yml"
      - ".github/workflows/publish-java.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "implementations/java/**"
      - ".github/workflows/java.yml"
      - ".github/workflows/publish-java.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test release decisions
        working-directory: .
        run: python3 -W error -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: implementations/java/pom.xml
      - name: Verify warnings, tests, coverage, and documentation
        run: mvn -B -ntp -f implementations/java/pom.xml clean verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-quality-reports
          path: |
            implementations/java/target/surefire-reports/
            implementations/java/target/site/jacoco/
